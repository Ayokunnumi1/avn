name: CI

on:
  push:
    branches: [main, 'claude/**', 'feat/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: avn, POSTGRES_PASSWORD: avn, POSTGRES_DB: avn_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U avn" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://avn:avn@localhost:5432/avn_test?schema=public
      TEST_DATABASE_URL: postgresql://avn:avn@localhost:5432/avn_test?schema=public
      SESSION_SECRET: ci-session-secret-0123456789abcdef0123456789abcdef
      REPORT_SIGNING_SECRET: ci-report-secret-0123456789abcdef0123456789abcdef
      STORAGE_SIGNING_SECRET: ci-storage-secret-0123456789abcdef0123456789abcd
      DATA_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - { file: node.Dockerfile, app: api }
          - { file: node.Dockerfile, app: worker }
          - { file: web.Dockerfile, app: applicant-web }
          - { file: web.Dockerfile, app: verifier-web }
          - { file: web.Dockerfile, app: business-web }
          - { file: web.Dockerfile, app: admin-web }
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infrastructure/docker/${{ matrix.file }} --build-arg APP=${{ matrix.app }} -t avn-${{ matrix.app }} .
